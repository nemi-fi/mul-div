name: Circuit and witness benchmarks
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: noir-lang/noirup@v0.1.5
        with:
          toolchain: 1.0.0
      - name: Install pinned Aztec toolchain
        run: |
          curl -fsSL https://install.aztec.network/6.0.0 -o /tmp/install-aztec.sh
          NON_INTERACTIVE=1 bash /tmp/install-aztec.sh
          echo "$HOME/.aztec/versions/6.0.0/bin" >> "$GITHUB_PATH"
      - name: Measure MulDiv circuit gates
        run: python3 scripts/benchmark.py
      - name: Compare constrained witness execution with bigint baseline
        run: python3 scripts/benchmark-witness.py
      - name: Compare U256 constrained witness execution
        run: python3 scripts/benchmark-witness.py --width 256
      - uses: actions/upload-artifact@v4
        with:
          name: arithmetic-cost-reports
          path: |
            target/circuit-report.json
            target/witness-report.json
            target/u256-witness-report.json
            target/benchmark-*.json
          if-no-files-found: error
