name: Test
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: noir-lang/noirup@v0.1.5
        with:
          toolchain: 1.0.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Verify Noir, Rust and isolated checkout consumption
        run: python3 scripts/verify.py --no-benchmarks
